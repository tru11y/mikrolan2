name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Lint / Type-check / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Dependency audit (prod, high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Unit tests
        run: npx jest --no-cache --ci --coverage
        env:
          NODE_ENV: test

      - name: E2E tests
        run: npx jest --config test/jest-e2e.json --runInBand --ci
        env:
          NODE_ENV: test

  mobile:
    name: Mobile — Lint / Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit
      # Backlog « CI MOBILE JOB MUST RUN EXPO LINT » : 0 erreur aujourd'hui (les avertissements ne bloquent pas).
      - name: Lint
        run: npx eslint .

  # Scripts de déploiement par artefact : analysés (shellcheck) et testés sans serveur ni réseau.
  deploy-scripts:
    name: Deploy scripts — shellcheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -S warning backend/deploy/release/*.sh backend/deploy/release/test/run-tests.sh
      - name: Tests
        run: bash backend/deploy/release/test/run-tests.sh

  # Ancien déploiement (npm ci + build SUR le VPS). Reste le mode PAR DÉFAUT tant que la variable de dépôt
  # DEPLOY_MODE n'est pas « artifact » : fusionner ce changement ne modifie donc rien en production.
  deploy:
    name: Deploy to VPS
    needs: [backend, mobile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_MODE != 'artifact'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            REPO=/opt/mikrolan2
            cd $REPO
            sudo git fetch origin main
            sudo git reset --hard origin/main
            cd backend
            sudo npm ci --legacy-peer-deps
            sudo npx prisma generate
            sudo npx prisma migrate deploy
            sudo npm run build
            sudo chown -R mikrolan:mikrolan $REPO
            sudo systemctl restart mikrolan-api

  # ── Déploiement par artefact (activé par la variable de dépôt DEPLOY_MODE=artifact) ──────────────────
  # Compilation et dépendances de production en CI ; le VPS ne reçoit qu'une archive vérifiée.
  # Procédure : docs/runbooks/deploy-artifact.md
  build-artifact:
    name: Build release artifact
    needs: [backend, mobile, deploy-scripts]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_MODE == 'artifact'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # La version majeure de Node doit être celle du serveur (modules natifs) ; le manifeste l'enregistre
      # et le déploiement refuse une archive construite pour une autre version.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build artifact
        run: bash backend/deploy/release/build-release.sh "$RUNNER_TEMP/release" "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/mikrolan-api-*
          retention-days: 14
          if-no-files-found: error

  deploy-artifact:
    name: Deploy artifact to VPS
    needs: [build-artifact]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_MODE == 'artifact'
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::secret VPS_KNOWN_HOSTS absent : l'empreinte du serveur doit être épinglée (voir docs/runbooks/deploy-artifact.md)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          opts="-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8"
          sha="$GITHUB_SHA"
          remote_dir="/tmp/mikrolan-deploy-$sha"
          archive="mikrolan-api-$sha.tar.gz"
          # shellcheck disable=SC2086,SC2029
          ssh $opts "$VPS_USER@$VPS_HOST" "umask 077 && mkdir -p '$remote_dir'"
          # shellcheck disable=SC2086,SC2029
          scp $opts "release/$archive" "release/$archive.sha256" "$VPS_USER@$VPS_HOST:$remote_dir/"
          # shellcheck disable=SC2086,SC2029
          ssh $opts "$VPS_USER@$VPS_HOST" "sudo /usr/local/lib/mikrolan-deploy/deploy-release.sh '$remote_dir/$archive' '$remote_dir/$archive.sha256' '$sha'"

      - name: Nettoyage du dossier temporaire distant
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          [ -f "$HOME/.ssh/id_deploy" ] || exit 0
          ssh -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "rm -rf '/tmp/mikrolan-deploy-$GITHUB_SHA'" || true
