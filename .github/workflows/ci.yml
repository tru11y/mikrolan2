name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Lint / Type-check / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --no-cache --ci --coverage
        env:
          NODE_ENV: test

      - name: E2E tests
        run: npx jest --config test/jest-e2e.json --runInBand --ci
        env:
          NODE_ENV: test

  mobile:
    name: Mobile — Lint / Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

  deploy:
    name: Deploy to VPS
    needs: [backend, mobile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            REPO=/opt/mikrolan2
            cd $REPO
            sudo git fetch origin main
            sudo git reset --hard origin/main
            cd backend
            sudo npm ci --legacy-peer-deps
            sudo npx prisma generate
            sudo npx prisma migrate deploy || true
            sudo npm run build
            sudo chown -R mikrolan:mikrolan $REPO
            sudo systemctl restart mikrolan-api
