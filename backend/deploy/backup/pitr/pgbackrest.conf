# pgBackRest — configuration MikroLan (PITR, dépôt S3)
#
# TEMPLATE. Installer sur le VPS en /etc/pgbackrest/pgbackrest.conf (postgres:postgres, 0640).
# Les SECRETS sont des PLACEHOLDERS : remplacer <...> en fenêtre de maintenance, ne jamais
# committer de vraie clé. Les clés S3 et la passphrase de chiffrement peuvent aussi être
# passées par variables d'environnement (voir README section « secrets »).
#
# Dépôt distant : s3://mikrolan-backups/pgbackrest (préfixe dédié, distinct des dumps
# pg_dump qui restent à la racine du bucket sous mikrolan-*.sql.gz).

[global]
# --- Dépôt 1 : S3 ---
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-bucket=mikrolan-backups
repo1-s3-endpoint=s3.us-east-1.amazonaws.com
repo1-s3-region=us-east-1
repo1-s3-key=<AWS_ACCESS_KEY_ID>
repo1-s3-key-secret=<AWS_SECRET_ACCESS_KEY>

# --- Chiffrement du dépôt (au repos, côté client) ---
# Les WAL et bases de base contiennent des données personnelles : chiffrer avant envoi S3.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=<REPO_CIPHER_PASSPHRASE>

# --- Rétention ---
# 4 bases full conservées (full hebdo → ~1 mois d'historique restaurable).
# Les diff/incr et les WAL plus anciens que la plus vieille full retenue sont expirés.
repo1-retention-full=4
repo1-retention-diff=6

# --- Compression & parallélisme ---
compress-type=zst
compress-level=6
process-max=2

# --- Archivage WAL ---
# Push asynchrone : n'allonge pas le chemin critique des commits Postgres.
archive-async=y
# Vérifie que l'archivage fonctionne avant/pendant le backup.
archive-check=y
archive-timeout=60

# --- Journalisation ---
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# --- Divers ---
start-fast=y
delta=y

# Stanza unique pour l'instance de production.
[mikrolan]
pg1-path=/var/lib/postgresql/data
pg1-port=5544
# Le seul rôle superuser de l'instance est `mikrolan` (POSTGRES_USER) ; il n'y a
# pas de rôle `postgres`. pgBackRest se connecte en mikrolan sur la base mikrolan.
pg1-user=mikrolan
pg1-database=mikrolan
