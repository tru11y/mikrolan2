# Drop-in MikroLan pour freeradius.service.
# Installé sur le VPS : /etc/systemd/system/freeradius.service.d/mikrolan.conf
# (install -o root -g root -m 0644), puis `systemctl daemon-reload`.
#
# RADIUS ne sert qu'à travers wg-mgmt et délègue tout à l'API : il ne doit
# démarrer qu'après le tunnel et (au mieux) après l'API.
[Unit]
After=mikrolan-api.service wg-quick@wg-mgmt.service
# Le tunnel est indispensable (sockets bindées sur 10.20.0.1) : sans lui,
# freeradius ne peut pas écouter. L'API n'est qu'un After (fail-closed si down).
Requires=wg-quick@wg-mgmt.service

[Service]
Restart=on-failure
RestartSec=5s
